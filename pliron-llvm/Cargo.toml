[package]
name = "pliron-llvm"
description = "LLVM dialect for pliron"
readme = "README.md"
version.workspace = true
edition.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["llvm-sys", "link-libffi"]

llvm-sys = ["dep:llvm-sys", "std"]
# Links libffi. Needed when LLVM is built with `LLVM_ENABLE_FFI=ON`
link-libffi = ["llvm-sys"]
std = ["pliron/std", "bitflags/std"]

[dependencies]
pliron = { path = "../", version = "0", default-features = false }

thiserror.workspace = true
log.workspace = true
bitflags = { workspace = true }

# When upgrading the LLVM version, change the LLVM versions in
# CI `.yml` files and the READMEs in `pliron-llvm` and `llvm-opt`.
llvm-sys = { version = "221", optional = true }

[dev-dependencies]
expect-test.workspace = true
tempfile.workspace = true
assert_cmd.workspace = true
env_logger.workspace = true
cargo-manifest.workspace = true
which.workspace = true
utf8-chars.workspace = true
